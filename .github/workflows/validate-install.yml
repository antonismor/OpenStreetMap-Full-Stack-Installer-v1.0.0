name: Validate install.sh

on:
  push:
    paths:
      - install.sh
      - .github/workflows/validate-install.yml
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify file is complete
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -l < install.sh)" -gt 1500
          grep -Eq 'SCRIPT_VERSION="[0-9]+\.[0-9]+\.[0-9]+"' install.sh
          grep -q 'full_greece_deployment()' install.sh
          grep -q 'install_telemetry()' install.sh
          grep -q 'pip.*install.*osmium' install.sh
          ! grep -q 'pip.*install.*pyosmium' install.sh
          grep -q 'openstreetmap-carto-flex.lua' install.sh
          grep -q 'common-values.sql' install.sh
          grep -q -- '-O flex' install.sh
          ! grep -q 'openstreetmap-carto.style' install.sh
          ! grep -q 'openstreetmap-carto.lua' install.sh
          grep -q 'NOMINATIM_OSM2PGSQL_BINARY=' install.sh
          grep -q 'NOMINATIM_DATABASE_DSN=pgsql:dbname=nominatim' install.sh
          grep -q "cd '\$NOM_PROJECT'.*nominatim.*import" install.sh
          grep -q 'prepare_pbf_access()' install.sh
          grep -q 'chmod 0644 "\$pbf"' install.sh
          grep -q -- '--slim' install.sh

      - name: Bash syntax
        shell: bash
        run: bash -n install.sh

      - name: Debian 13 Bash syntax
        shell: bash
        run: |
          docker run --rm -v "$PWD:/repo:ro" debian:13 bash -n /repo/install.sh
